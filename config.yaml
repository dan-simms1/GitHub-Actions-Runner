  workdir: "/data/work"
  cleanup_on_stop: true
  log_level: "info"
  runner_version: "latest"
schema:
  repo_url: str
  github_token: password
  runner_name: str
  runner_labels: str
  ephemeral: bool
  workdir: str
  cleanup_on_stop: bool
  log_level: list(debug|info|warning|error)
  runner_version: str
