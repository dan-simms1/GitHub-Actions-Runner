name: GitHub Actions Runner
version: "1.0.0"
slug: github_actions_runner
description: "Home Assistant add-on that runs a GitHub self-hosted Actions runner"
url: https://github.com/dan-simms1/GitHub-Actions-Runner
stage: stable
startup: services
host_network: false
homeassistant_api: false
hassio_api: false
ingress: false
arch:
  - aarch64
  - armv7
  - amd64
  - i386
options:
  repo_url: ""
  runner_name: ha-runner-1
  runner_labels:
    - ha
    - self-hosted
  github_token: ""
  ephemeral: true
  workdir: "/data/_work"
  cleanup_on_stop: true
  log_level: info
  runner_version: ""
schema:
  repo_url: str
  runner_name: str
  runner_labels:
    - str
  github_token: password
  ephemeral: bool
  workdir: str
  cleanup_on_stop: bool
  log_level: list(debug|info|warn|error)
  runner_version: str?
secrets: true
